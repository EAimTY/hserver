[package]
name = "hserver"
version = "0.2.0"
authors = ["EAimTY <ea.imty@gmail.com>"]
description = "Configurable HTTP server with explicit accept-loop control and optional Rustls support"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EAimTY/hserver"
categories = ["asynchronous", "network-programming", "web-programming::http-server"]
keywords = ["http", "server", "hyper", "tower", "tokio"]

[features]
default = ["http1", "http2"]
http1 = ["hyper-util/http1"]
http2 = ["hyper-util/http2"]
tls = ["dep:rustls", "dep:tokio-rustls"]

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std"] }
h2 = { version = "0.4", default-features = false }
hserver = { path = ".", features = ["http1", "http2", "tls"] }
http = { version = "1.5.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tower-service = { version = "0.3.3", default-features = false }

[dependencies]
http = { version = "1.5.0", default-features = false }
http-body = { version = "1.1.0", default-features = false }
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "tokio"] }
pin-project = { version = "1.1.13", default-features = false }
rustls = { version = "0.23.44", default-features = false, optional = true }
tokio = { version = "1.53.1", default-features = false }
tokio-rustls = { version = "0.26.5", default-features = false, optional = true }
tower-service = { version = "0.3.3", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
missing_panics_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[package.metadata.docs.rs]
all-features = true
