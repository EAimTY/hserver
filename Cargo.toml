[package]
name = "hserver"
version = "0.1.1"
authors = ["EAimTY <ea.imty@gmail.com>"]
description = "Configurable HTTP server with explicit accept-loop control and optional Rustls support"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EAimTY/hserver"
categories = ["asynchronous", "network-programming", "web-programming::http-server"]
keywords = ["http", "server", "hyper", "tower", "tokio"]

[features]
default = ["http1", "http2"]
http1 = ["hyper-util/http1"]
http2 = ["hyper-util/http2"]
tls = ["dep:rustls", "dep:tokio-rustls"]

[dev-dependencies]
hserver = { path = ".", features = ["http1", "http2", "tls"] }
tokio = { version = "1.51.0", default-features = false, features = ["net", "rt"] }

[dependencies]
http = { version = "1.4.0", default-features = false }
http-body = { version = "1.0.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.9.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "tokio"] }
pin-project = { version = "1.1.11", default-features = false }
rustls = { version = "0.23.37", default-features = false, optional = true }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.51.0", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, optional = true }
tower-service = { version = "0.3.3", default-features = false }

[package.metadata.docs.rs]
all-features = true
